nameOverride: csbc-consent-manager-cms

image:
  repository: ghcr.io/bcgov/csbc-consent-manager-cms
  tag: "latest"
  pullPolicy: IfNotPresent

migrate:
  image:
    repository: ghcr.io/bcgov/csbc-consent-manager-cms-migrate
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

replicas: 2

auth:
  existingSecret: csbc-consent-manager-cms-credentials
  secretKeys:
    databaseUri: database-uri
    payloadSecret: payload-secret
    oidcClientId: oidc-client-id
    oidcClientSecret: oidc-client-secret

oidc:
  issuer: ""

publicUrl: ""
consentApiUrl: ""

service:
  port: 3000

route:
  enabled: true
  host: ""

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
