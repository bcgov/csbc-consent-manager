{{- if .Values.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cms.fullname" . }}-seed-{{ .Release.Revision }}
  labels:
    {{- include "cms.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "cms.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: "{{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag }}"
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          command: ["npx", "--workspace=apps/cms", "payload", "run", "./src/scripts/seed/seed.ts"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          env:
            {{- include "cms.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.seed.resources | nindent 12 }}
{{- end }}
