services:
  postgres:
    image: postgres:18
    container_name: csbc-service-catalogue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-service-catalogue}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-service-catalogue}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
